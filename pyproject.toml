[project]
name = "cotxa"
version = "0.1.0"
description = "Reparto equilibrado de coche compartido entre profesorado con horarios distintos"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
import = ["openpyxl>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
cotxa = "cotxa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
